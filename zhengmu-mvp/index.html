<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>证目 — 证明目的线性流程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">证目</span>
        <span class="brand-tag">证明目的 · 线性工作流</span>
      </div>
      <p class="topbar-lede">简洁 · 可核对 · 可溯源 · 律师终审 — 不做一键可上庭</p>
      <div class="topbar-meta">
        <span class="pill soft">演示案件 · 交通事故人伤</span>
      </div>
    </header>

    <main class="flow-shell">
      <!-- Horizontal overview spine -->
      <section class="flow-overview" aria-label="用户旅程线性图">
        <div class="overview-head">
          <div>
            <p class="eyebrow">用户旅程 · 线性图</p>
            <h1>证目工作流</h1>
          </div>
          <button class="btn ghost tiny" id="btn-collapse-all" type="button">收起全部节点</button>
        </div>
        <ol class="spine-h" id="spine-h"></ol>
      </section>

      <!-- Vertical expandable spine -->
      <section class="flow-detail" aria-label="逐步展开">
        <div class="spine-v" id="spine-v"></div>
      </section>
    </main>

    <footer class="footer">
      <span>证目 MVP Demo · 线性流程图原型</span>
      <span>Human-in-the-loop · 不做一键可上庭</span>
    </footer>
  </div>

  <dialog id="cite-dialog">
    <form method="dialog" class="cite-sheet">
      <header>
        <h3 id="cite-title">引用核验</h3>
        <button class="btn tiny ghost" value="close" type="submit">关闭</button>
      </header>
      <div id="cite-body"></div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
