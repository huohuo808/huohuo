<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>火火</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" aria-label="对话列表">
        <div class="sidebar-top">
          <div class="brand-row">
            <span class="brand">火火</span>
            <button type="button" id="close-sidebar" class="icon-btn mobile-only" aria-label="关闭侧栏">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </div>
          <button type="button" id="new-chat" class="new-chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4 11.5-11.5z" /></svg>
            <span>新对话</span>
          </button>
        </div>
        <nav id="conv-list" aria-label="历史对话">
          <p class="list-note">正在加载…</p>
        </nav>
        <div class="sidebar-foot">切换角色会开始一段新对话</div>
      </aside>
      <div id="backdrop" hidden></div>
      <div id="stage">
        <header id="topbar">
          <button type="button" id="open-sidebar" class="icon-btn" aria-label="打开侧栏">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
          </button>
          <button type="button" id="header-new" class="icon-btn" aria-label="新对话">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4 11.5-11.5z" /></svg>
          </button>
          <div class="role-wrap">
            <button type="button" id="role-button" aria-haspopup="listbox" aria-expanded="false" aria-controls="role-menu">
              <span id="role-label">猫娘</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
            </button>
            <div id="role-menu" role="listbox" hidden></div>
          </div>
        </header>
        <div id="banner" class="banner" hidden></div>
        <div id="scroller">
          <div id="empty"></div>
          <ol id="messages" class="messages"></ol>
        </div>
        <div id="composer-dock">
          <form id="composer">
            <div class="composer-box">
              <label class="sr-only" for="input">消息</label>
              <textarea id="input" rows="1" maxlength="12000" placeholder="给火火发消息" autocomplete="off" enterkeyhint="send"></textarea>
              <button type="submit" id="send" class="send" disabled aria-label="发送">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
              </button>
              <button type="button" id="stop" class="send stop" hidden aria-label="停止生成">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5" /></svg>
              </button>
            </div>
          </form>
          <p class="fineprint">内容由「火火」生成，请核对重要信息。</p>
        </div>
      </div>
    </div>
    <div id="dialog" class="dialog" hidden>
      <div class="dialog-card" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-text">
        <h2 id="dialog-title">删除这段对话？</h2>
        <p id="dialog-text">删除后无法恢复。</p>
        <div class="dialog-actions">
          <button type="button" id="dialog-cancel">取消</button>
          <button type="button" id="dialog-confirm" class="danger">删除</button>
        </div>
      </div>
    </div>
    <div id="toast" hidden role="status"></div>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <script type="module" src="/js/app.js"></script>
    <noscript><p class="noscript">请开启 JavaScript 后再使用火火。</p></noscript>
  </body>
</html>
